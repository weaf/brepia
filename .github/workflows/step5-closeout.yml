name: Step 5 closeout

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.ref == 'feature/multifile-openscad-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/multifile-openscad-workspace
          fetch-depth: 0
      - run: python3 scripts/close-step5-project-native.py
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm run build
      - run: git diff --check
      - name: Commit verified Step 5 closeout
        run: |
          rm scripts/close-step5-project-native.py
          rm .github/workflows/step5-closeout.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete project-native AI editing Step 5"
          git push origin HEAD:feature/multifile-openscad-workspace
