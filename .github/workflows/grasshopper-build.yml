name: Grasshopper Build

on:
  pull_request:
    paths:
      - 'grasshopper/**'
      - 'tests/brepGrasshopperPlugin.test.ts'
      - 'tests/brepGrasshopperPackaging.test.ts'
      - '.github/workflows/grasshopper-build.yml'
  push:
    branches:
      - master
    paths:
      - 'grasshopper/**'
      - 'tests/brepGrasshopperPlugin.test.ts'
      - 'tests/brepGrasshopperPackaging.test.ts'
      - '.github/workflows/grasshopper-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore grasshopper/Brepia.Grasshopper/Brepia.Grasshopper.csproj

      - name: Build
        run: dotnet build grasshopper/Brepia.Grasshopper/Brepia.Grasshopper.csproj --configuration Release --no-restore --warnaserror

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: brepia-grasshopper
          path: grasshopper/Brepia.Grasshopper/bin/Release/net8.0/Brepia.Grasshopper.gha
          if-no-files-found: error
          retention-days: 14

  package-proof:
    name: Package proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packager
        run: dotnet restore grasshopper/Brepia.Grasshopper.Packager/Brepia.Grasshopper.Packager.csproj

      - name: Build packager
        run: dotnet build grasshopper/Brepia.Grasshopper.Packager/Brepia.Grasshopper.Packager.csproj --configuration Release --no-restore --warnaserror

      - name: Serialize representative Brepia project
        run: dotnet run --project grasshopper/Brepia.Grasshopper.Packager/Brepia.Grasshopper.Packager.csproj --configuration Release --no-build -- "grasshopper/fixtures/cabinet-a42.brepia-grasshopper.json" "${{ runner.temp }}/brepia-cabinet-a42.gh"

      - name: Upload generated Grasshopper document
        uses: actions/upload-artifact@v4
        with:
          name: brepia-grasshopper-gh-${{ runner.os }}
          path: ${{ runner.temp }}/brepia-cabinet-a42.gh
          if-no-files-found: error
          retention-days: 14
