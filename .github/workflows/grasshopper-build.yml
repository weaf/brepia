name: Grasshopper Build

on:
  pull_request:
    paths:
      - 'grasshopper/**'
      - '.github/workflows/grasshopper-build.yml'
  push:
    branches:
      - master
    paths:
      - 'grasshopper/**'
      - '.github/workflows/grasshopper-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore grasshopper/Brepia.Grasshopper/Brepia.Grasshopper.csproj

      - name: Build
        run: dotnet build grasshopper/Brepia.Grasshopper/Brepia.Grasshopper.csproj --configuration Release --no-restore --warnaserror
