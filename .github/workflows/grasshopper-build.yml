name: Grasshopper Build

on:
  pull_request:
    paths:
      - 'grasshopper/**'
      - 'shared/brepGrasshopperPackagePlan.ts'
      - 'tests/brepGrasshopperPlugin.test.ts'
      - 'tests/brepGrasshopperPackaging.test.ts'
      - 'tests/brepGrasshopperPackagePlan.test.ts'
      - '.github/workflows/grasshopper-build.yml'
  push:
    branches:
      - master
    paths:
      - 'grasshopper/**'
      - 'shared/brepGrasshopperPackagePlan.ts'
      - 'tests/brepGrasshopperPlugin.test.ts'
      - 'tests/brepGrasshopperPackaging.test.ts'
      - 'tests/brepGrasshopperPackagePlan.test.ts'
      - '.github/workflows/grasshopper-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore grasshopper/Brepia.Grasshopper/Brepia.Grasshopper.csproj

      - name: Build
        run: dotnet build grasshopper/Brepia.Grasshopper/Brepia.Grasshopper.csproj --configuration Release --no-restore --warnaserror

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: brepia-grasshopper
          path: grasshopper/Brepia.Grasshopper/bin/Release/net8.0/Brepia.Grasshopper.gha
          if-no-files-found: error
          retention-days: 14

  package-build:
    name: Package build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packager
        run: dotnet restore grasshopper/Brepia.Grasshopper.Packager/Brepia.Grasshopper.Packager.csproj

      - name: Build packager
        run: dotnet build grasshopper/Brepia.Grasshopper.Packager/Brepia.Grasshopper.Packager.csproj --configuration Release --no-restore --warnaserror

  gh-io-runtime-proof:
    name: GH_IO runtime proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore standalone GH_IO probe
        run: dotnet restore grasshopper/Brepia.GhIoProbe/Brepia.GhIoProbe.csproj

      - name: Build standalone GH_IO probe
        run: dotnet build grasshopper/Brepia.GhIoProbe/Brepia.GhIoProbe.csproj --configuration Release --no-restore --warnaserror

      - name: Round-trip standalone GH_IO XML archive
        run: dotnet run --project grasshopper/Brepia.GhIoProbe/Brepia.GhIoProbe.csproj --configuration Release --no-build -- "${{ runner.temp }}/brepia-gh-io-probe.ghx"

      - name: Upload GH_IO probe archive
        uses: actions/upload-artifact@v4
        with:
          name: brepia-gh-io-probe-${{ runner.os }}
          path: ${{ runner.temp }}/brepia-gh-io-probe.ghx
          if-no-files-found: error
          retention-days: 14
