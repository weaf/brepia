name: Quality Gate

on:
  push:
    branches:
      - chore/history-build-cleanup
  pull_request:

permissions:
  contents: read

jobs:
  fix-prompt-profile-callback-order:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chore/history-build-cleanup

      - name: Move callback before dependent callback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/settings/PromptProfilesSettings.tsx')
          text = path.read_text()
          block = """  const isBuiltInEdit = useCallback(() => {\n    return editorMode === 'create' && pendingMode !== null;\n  }, [editorMode, pendingMode]);\n\n"""
          marker = '  const handleSave = useCallback(\n'
          block_index = text.find(block)
          marker_index = text.find(marker)
          if block_index < 0 or marker_index < 0:
              raise SystemExit('PromptProfilesSettings.tsx: callback block or marker not found')
          if block_index < marker_index:
              raise SystemExit(0)
          text = text.replace(block, '', 1)
          text = text.replace(marker, block + marker, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Commit callback-order fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/settings/PromptProfilesSettings.tsx
          git commit -m "fix: declare prompt edit callback before use"
          git push origin HEAD:chore/history-build-cleanup

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build
