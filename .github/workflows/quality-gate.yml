name: Quality Gate

on:
  push:
    branches:
      - chore/history-build-cleanup
  pull_request:

permissions:
  contents: read

jobs:
  remove-obsolete-image-history:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chore/history-build-cleanup

      - name: Remove dead rollback implementations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/server/imageGen.ts')
          text = path.read_text()
          patterns = [
              r'/\* DEPRECATED: Gemini 2\.0 Flash discontinued March 2026.*?\*/\n\n(?=export type GptImageQuality)',
              r'/\* DEPRECATED: Replaced by generateImageWithFalFlux.*?\*/\n?',
          ]
          for pattern in patterns:
              text, count = re.subn(pattern, '', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'imageGen.ts: expected exactly one match for {pattern}')
          path.write_text(text.rstrip() + '\n')
          PY
          git diff --check

      - name: Commit history cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/imageGen.ts
          git commit -m "chore: remove dead image generation rollback history"
          git push origin HEAD:chore/history-build-cleanup

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build
