name: Quality Gate

on:
  push:
    branches:
      - chore/history-build-cleanup
  pull_request:

permissions:
  contents: write

jobs:
  remove-google-mesh-paths:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chore/history-build-cleanup

      - name: Remove Google mesh fallbacks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/server/falMesh.ts')
          text = path.read_text()

          replacements = [
              ("import { GoogleGenAI } from '@google/genai';\n", ""),
              ("  generateImageWithGeminiMultiTurn,\n", ""),
              ("//   2. Fallback 1: Gemini 3 Pro Image Preview (nano banana pro)\n//   3. Fallback 2: Flux (fal-ai)\n", "//   2. Fallback: Flux (fal-ai)\n"),
              ("  let provider: 'gpt-image-2' | 'nano-banana-pro' | 'flux';\n", "  let provider: 'gpt-image-2' | 'flux';\n"),
              ("function getGoogleGenAI() {\n  return new GoogleGenAI({ apiKey: requiredEnv('GOOGLE_API_KEY') });\n}\n\n", ""),
              ("  //   - Sentry events tagged stage=gpt_image_2_fallback / nano_banana_pro_fallback\n  //     / flux_fallback with full meshModel + subStage context\n", "  //   - Sentry events tagged stage=gpt_image_2_fallback / flux_fallback\n  //     with full meshModel + subStage context\n"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          old_fallback = """    try {\n      const imageBytes = await generateImageWithGeminiMultiTurn(\n        supabaseClient,\n        getGoogleGenAI(),\n        userId,\n        conversationId,\n        prompt,\n        gptImageReferenceImages,\n      );\n      // Gemini Multi-Turn returns png.\n      result = { imageBytes, imageCallId: null, contentType: 'image/png' };\n      provider = 'nano-banana-pro';\n    } catch (geminiError) {\n      logError(geminiError, {\n        ...sentryContext,\n        additionalContext: {\n          stage: 'nano_banana_pro_fallback',\n          hasFreshUserImages,\n          priorImageCallIdStatus,\n          ...sentryStage,\n        },\n      });\n      try {\n        const imageBytes = await generateImageWithFalFlux(\n          supabaseClient,\n          userId,\n          conversationId,\n          prompt,\n          gptImageReferenceImages,\n        );\n        // Flux returns png per its output_format config.\n        result = { imageBytes, imageCallId: null, contentType: 'image/png' };\n        provider = 'flux';\n      } catch (fluxError) {\n        logError(fluxError, {\n          ...sentryContext,\n          additionalContext: {\n            stage: 'flux_fallback',\n            hasFreshUserImages,\n            priorImageCallIdStatus,\n            ...sentryStage,\n          },\n        });\n        throw fluxError;\n      }\n    }\n"""
          new_fallback = """    try {\n      const imageBytes = await generateImageWithFalFlux(\n        supabaseClient,\n        userId,\n        conversationId,\n        prompt,\n        gptImageReferenceImages,\n      );\n      // Flux returns png per its output_format config.\n      result = { imageBytes, imageCallId: null, contentType: 'image/png' };\n      provider = 'flux';\n    } catch (fluxError) {\n      logError(fluxError, {\n        ...sentryContext,\n        additionalContext: {\n          stage: 'flux_fallback',\n          hasFreshUserImages,\n          priorImageCallIdStatus,\n          ...sentryStage,\n        },\n      });\n      throw fluxError;\n    }\n"""
          if text.count(old_fallback) != 1:
              raise SystemExit('Expected exactly one Gemini image fallback block')
          text = text.replace(old_fallback, new_fallback, 1)

          pattern = re.compile(
              r"\n        // Genericize the caption - replace character names with visual descriptions\n"
              r"        if \(longCaption\) \{.*?\n        \}\n      \} catch \(error\) \{",
              re.S,
          )
          text, count = pattern.subn("\n      } catch (error) {", text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Gemini caption genericizer block, found {count}')

          text = text.replace(
              '// 1. Pre-fetch Moondream3 long caption and genericize it\n',
              '// 1. Pre-fetch Moondream3 long caption\n',
              1,
          )
          text = text.replace(
              '// 3. If low score, fallback to genericized caption\n',
              '// 3. If low score, fallback to the Moondream3 caption\n',
              1,
          )

          if '@google/genai' in text or 'getGoogleGenAI' in text or 'generateImageWithGeminiMultiTurn' in text:
              raise SystemExit('Google GenAI references remain in falMesh.ts')

          path.write_text(text)
          PY
          git diff --check

      - name: Commit mesh cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/falMesh.ts
          git commit -m "remove Google mesh fallbacks"
          git push origin HEAD:chore/history-build-cleanup

  quality:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build
