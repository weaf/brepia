name: Quality Gate

on:
  push:
    branches:
      - chore/history-build-cleanup
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency diagnostics
        continue-on-error: true
        shell: bash
        run: |
          npm explain whatwg-encoding node-domexception glob
          npm explain shiki @shikijs/engine-oniguruma @shikijs/engine-javascript @streamdown/code
          npm explain brace-expansion dompurify js-yaml mermaid nanoid postcss protobufjs undici
          npm audit

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
