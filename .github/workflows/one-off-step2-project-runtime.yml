name: One-off Step 2 project runtime migration

on:
  push:
    branches:
      - feature/multifile-openscad-workspace
    paths:
      - scripts/one-off-step2-project-runtime.py
      - .github/workflows/one-off-step2-project-runtime.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/multifile-openscad-workspace
          fetch-depth: 0
      - name: Apply project-runtime migration
        run: python3 scripts/one-off-step2-project-runtime.py
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify legacy worker APIs are gone from migrated runtime
        run: |
          ! grep -R "previewScadColoredViaToolWorker(code)" -n src
          ! grep -R "previewScadColored(preview.code)" -n src
          ! grep -R "data.code" -n src/worker/openSCAD.ts src/worker/worker.ts
      - name: Remove one-off migration files
        run: |
          rm scripts/one-off-step2-project-runtime.py
          rm .github/workflows/one-off-step2-project-runtime.yml
      - name: Commit green Step 2 runtime migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make OpenSCAD browser runtime project-native"
          git push origin HEAD:feature/multifile-openscad-workspace
