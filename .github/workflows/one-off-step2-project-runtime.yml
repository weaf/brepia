name: One-off Step 2 project runtime migration

on:
  push:
    branches:
      - feature/multifile-openscad-workspace
    paths:
      - scripts/one-off-step2-project-runtime.py
      - .github/workflows/one-off-step2-project-runtime.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/multifile-openscad-workspace
          fetch-depth: 0
      - name: Reconcile ShareView migration match
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/one-off-step2-project-runtime.py')
          text = p.read_text()
          old = '    "              scadCode={activePreview.artifact.code}",'
          new = '    "              scadCode={activeArtifactCode}",'
          if text.count(old) != 1:
              raise SystemExit(f'expected one ShareView script match, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
      - name: Apply project-runtime migration
        run: python3 scripts/one-off-step2-project-runtime.py
      - name: Make ChatTitle share project-aware
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {found}: {old[:80]!r}')
              p.write_text(text.replace(old, new))

          replace_exact(
              'src/components/chat/ChatTitle.tsx',
              "} from '@shared/aiInstructionCatalog';\n",
              "} from '@shared/aiInstructionCatalog';\nimport type { OpenScadProject } from '@shared/openScadProject';\n",
          )
          replace_exact(
              'src/components/chat/ChatTitle.tsx',
              "  activeOpenscadCode?: string | null;\n}",
              "  activeOpenscadProject?: OpenScadProject | null;\n}",
          )
          replace_exact(
              'src/components/chat/ChatTitle.tsx',
              "  activeMeshId,\n  activeOpenscadCode,\n}: ChatTitleProps = {}) {",
              "  activeMeshId,\n  activeOpenscadProject,\n}: ChatTitleProps = {}) {",
          )
          replace_exact(
              'src/components/chat/ChatTitle.tsx',
              "                          openscadCode={activeOpenscadCode ?? undefined}",
              "                          openscadProject={activeOpenscadProject ?? undefined}",
          )
          replace_exact(
              'src/views/EditorView.tsx',
              "  const shareArtifactCode =\n    sharePreview?.type === 'artifact'\n      ? getParametricArtifactEntrypointCode(sharePreview.artifact)\n      : undefined;\n",
              "",
          )
          replace_exact(
              'src/views/EditorView.tsx',
              "                  activeOpenscadCode={shareArtifactCode}\n                />",
              "                  activeOpenscadProject={\n                    sharePreview?.type === 'artifact'\n                      ? sharePreview.artifact.project\n                      : undefined\n                  }\n                />",
          )
          replace_exact(
              'src/views/ShareView.tsx',
              "                activeOpenscadCode={activeArtifactCode}\n              />",
              "                activeOpenscadProject={\n                  activePreview?.type === 'artifact'\n                    ? activePreview.artifact.project\n                    : undefined\n                }\n              />",
          )
          PY
      - name: Preserve existing entrypoint-relative mesh imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/worker/openSCAD.ts')
          text = p.read_text()
          old = """      instance.FS.writeFile(projectPath, file.content);
    }
    if (!this.fileExists(instance, '/libraries')) {
"""
          new = """      instance.FS.writeFile(projectPath, file.content);
    }

    // Existing uploaded mesh files are intentionally still an external cache
    // until the explicit project-asset phase. OpenSCAD resolves import()
    // relative to the importing script, so mirror each cached basename beside
    // the entrypoint to preserve the v1 import(\"mesh.stl\") behavior after
    // moving the script from /input.scad into /project/<entrypoint>.
    const entrypointSegments = normalizedProject.entrypointPath.split('/');
    entrypointSegments.pop();
    const entrypointDir = entrypointSegments.join('/');
    const projectSourcePaths = new Set(
      normalizedProject.files.map((file) => `${projectRoot}/${file.path}`),
    );
    for (const externalFile of this.files) {
      if (!externalFile.path) continue;
      const externalName = externalFile.path
        .replace(/\\\\/g, '/')
        .split('/')
        .pop();
      if (!externalName || externalName === '.' || externalName === '..') {
        continue;
      }
      const externalPath = `${projectRoot}/${
        entrypointDir ? `${entrypointDir}/` : ''
      }${externalName}`;
      if (projectSourcePaths.has(externalPath)) {
        throw new Error(
          `External OpenSCAD asset collides with project source: ${externalName}`,
        );
      }
      const externalContent = await externalFile.arrayBuffer();
      instance.FS.writeFile(externalPath, new Int8Array(externalContent));
    }

    if (!this.fileExists(instance, '/libraries')) {
"""
          found = text.count(old)
          if found != 1:
              raise SystemExit(f'expected one project mount insertion point, found {found}')
          p.write_text(text.replace(old, new))
          PY
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify legacy worker APIs are gone from migrated runtime
        run: |
          ! grep -R "previewScadColoredViaToolWorker(code)" -n src
          ! grep -R "previewScadColored(preview.code)" -n src
          ! grep -R "data.code" -n src/worker/openSCAD.ts src/worker/worker.ts
          ! grep -R "openscadCode=" -n src/components/chat/ChatTitle.tsx src/components/ui/ShareContent.tsx
          ! grep -R "activeOpenscadCode" -n src/components/chat/ChatTitle.tsx
          ! grep -R "shareArtifactCode" -n src/views/EditorView.tsx
          grep -F "Existing uploaded mesh files are intentionally still an external cache" src/worker/openSCAD.ts
      - name: Remove one-off migration files
        run: |
          rm scripts/one-off-step2-project-runtime.py
          rm .github/workflows/one-off-step2-project-runtime.yml
      - name: Commit green Step 2 runtime migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make OpenSCAD browser runtime project-native"
          git push origin HEAD:feature/multifile-openscad-workspace
