name: Verify final model routing refinements

on:
  push:
    branches:
      - feature/configurable-model-routing

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/configurable-model-routing
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply refinements
        run: |
          python3 scripts/refine-configurable-model-routing.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/settings/CreativeRuntimeModelSettings.tsx')
          text = path.read_text()
          old = "              {value && !selected && (\n"
          if old not in text:
              raise SystemExit('Expected stale selected reference not found')
          path.write_text(text.replace(old, "              {value && (\n", 1))
          PY
          rm scripts/refine-configurable-model-routing.py
          rm .github/workflows/refine-configurable-model-routing.yml

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build

      - name: Remove unrelated generated route-tree changes
        run: git checkout HEAD -- src/routeTree.gen.ts

      - name: Diff check
        run: git diff --check

      - name: Commit verified refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine configurable model routing'
          git push origin HEAD:feature/configurable-model-routing
