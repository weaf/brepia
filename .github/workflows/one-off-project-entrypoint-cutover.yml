name: One-off project entrypoint cutover

on:
  push:
    branches:
      - feature/multifile-openscad-workspace
    paths:
      - scripts/one-off-project-entrypoint-cutover.mjs
      - .github/workflows/one-off-project-entrypoint-cutover.yml

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/multifile-openscad-workspace
          fetch-depth: 0
      - name: Apply exact project entrypoint substitutions
        run: node scripts/one-off-project-entrypoint-cutover.mjs
      - name: Remove one-off migration files
        run: |
          rm scripts/one-off-project-entrypoint-cutover.mjs
          rm .github/workflows/one-off-project-entrypoint-cutover.yml
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/chat/ChatSession.tsx src/components/chat/MessageBubble.tsx src/views/EditorView.tsx scripts/one-off-project-entrypoint-cutover.mjs .github/workflows/one-off-project-entrypoint-cutover.yml
          git commit -m "Migrate Parametric UI to project entrypoints"
          git push origin HEAD:feature/multifile-openscad-workspace
