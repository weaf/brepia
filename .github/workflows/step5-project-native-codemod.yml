name: Step 5 project-native codemod

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'feature/multifile-openscad-workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/multifile-openscad-workspace
          fetch-depth: 0

      - name: Apply deterministic Step 5 codemods
        run: |
          python3 scripts/apply-step5-project-native.py
          python3 scripts/apply-step5-project-tests.py
          python3 scripts/apply-step5-test-fixture-fixes.py

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build

      - name: Whitespace check
        run: git diff --check

      - name: Commit verified Step 5 transport changes
        run: |
          rm scripts/apply-step5-project-native.py
          rm scripts/apply-step5-project-tests.py
          rm scripts/apply-step5-test-fixture-fixes.py
          rm .github/workflows/step5-project-native-codemod.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make AI transports project-native"
          git push origin HEAD:feature/multifile-openscad-workspace
