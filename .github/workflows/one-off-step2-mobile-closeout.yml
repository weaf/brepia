name: One-off Step 2 mobile closeout

on:
  push:
    branches:
      - feature/multifile-openscad-workspace
    paths:
      - scripts/one-off-step2-mobile-closeout.py
      - .github/workflows/one-off-step2-mobile-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/multifile-openscad-workspace
          fetch-depth: 0
      - name: Apply mobile closeout patch
        run: python3 scripts/one-off-step2-mobile-closeout.py
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify closeout changes
        run: |
          grep -F "window.setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);" src/components/viewer/MeshGifPreview.tsx
          grep -F "Upload STL model" src/components/TextAreaChat.tsx
          ! grep -F 'input.accept = `${VALID_IMAGE_FORMATS.join' src/components/TextAreaChat.tsx
      - name: Remove one-off files
        run: |
          rm scripts/one-off-step2-mobile-closeout.py
          rm .github/workflows/one-off-step2-mobile-closeout.yml
      - name: Commit closeout fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile GIF download and STL picker"
          git push origin HEAD:feature/multifile-openscad-workspace
