name: Promotion-only validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated promotion metadata
        run: |
          test -s brepia-release-manifest.json
          test -s brepia-release-provenance.json
          test -s brepia-release-report.json
          test "$(node -p "require('./package.json').version")" = "2.0.0"
          node -e "const p=require('./brepia-release-provenance.json'); if (p.publicVersion !== '2.0.0' || p.internalQualificationTag !== 'v1.8.0') process.exit(1)"
