name: Apply configurable model routing

on:
  push:
    branches:
      - feature/configurable-model-routing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'Make runtime model routing configurable')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/configurable-model-routing
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply model routing migration
        run: |
          python3 scripts/apply-configurable-model-routing.py
          python3 scripts/fix-configurable-model-routing.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified changes
        run: |
          if git diff --quiet; then
            echo 'Migration produced no changes.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make runtime model routing configurable'
          git push origin HEAD:feature/configurable-model-routing
