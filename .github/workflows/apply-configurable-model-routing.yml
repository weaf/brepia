name: Finalize configurable model routing

on:
  push:
    branches:
      - feature/configurable-model-routing

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: feature/configurable-model-routing
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build

      - name: Remove temporary tooling and unrelated generated diff
        run: |
          git checkout origin/chore/history-build-cleanup -- src/routeTree.gen.ts
          rm .github/workflows/apply-configurable-model-routing.yml
          rm scripts/apply-configurable-model-routing.py
          rm scripts/fix-configurable-model-routing.py

      - name: Diff check
        run: git diff --check

      - name: Commit clean final state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize configurable model routing'
          git push origin HEAD:feature/configurable-model-routing
