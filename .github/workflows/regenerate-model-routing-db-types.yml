name: Regenerate model routing database types

on:
  push:
    branches:
      - chore/regenerate-model-routing-db-types

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Disable seed for schema-only verification
        run: |
          printf '\n[db.seed]\nenabled = false\n' >> supabase/config.toml

      - name: Start local Supabase
        run: npx supabase start

      - name: Apply pending migrations
        run: npx supabase migration up

      - name: Regenerate database types
        run: |
          npx supabase gen types typescript --local > shared/database.ts
          npx prettier shared/database.ts --write
          grep -q "model_routing" shared/database.ts

      - name: Restore repository Supabase config
        run: git checkout -- supabase/config.toml

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Build
        run: npm run build

      - name: Keep generated route tree out of this fix
        run: git checkout -- src/routeTree.gen.ts

      - name: Remove temporary workflow
        run: rm .github/workflows/regenerate-model-routing-db-types.yml

      - name: Diff check
        run: git diff --check

      - name: Commit generated types
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/database.ts .github/workflows/regenerate-model-routing-db-types.yml
          if git diff --cached --quiet; then
            echo "No generated type changes to commit."
            exit 0
          fi
          git commit -m "Regenerate database types after model routing"
          git push
