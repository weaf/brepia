name: Revolve Native Gate B

on:
  push:
    branches:
      - feature/brep-grasshopper-gh-packaging
    paths:
      - .github/workflows/revolve-native-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-revolve:
    name: pinned rootless build123d/OCCT revolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch checkpoint
        uses: actions/checkout@v4

      - name: Install Podman
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
          podman info --format 'rootless={{.Host.Security.Rootless}}'
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = "true"

      - name: Build pinned native CAD image
        shell: bash
        run: |
          set -euo pipefail
          podman build \
            --tag localhost/brepia-brep:build123d-0.11.1 \
            --file scripts/brep/Containerfile \
            scripts/brep

      - name: Run bounded revolve Gate B smoke
        shell: bash
        env:
          PCAD_BREP_IMAGE: localhost/brepia-brep:build123d-0.11.1
        run: |
          set -euo pipefail
          bash scripts/brep/revolve-smoke.sh
