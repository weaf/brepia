# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "brepia"

# Host-facing ports are allocated per checkout by scripts/supabase-local.sh.
[api]
port = "env(BREPIA_SUPABASE_API_PORT)"

[db]
port = "env(BREPIA_SUPABASE_DB_PORT)"
shadow_port = "env(BREPIA_SUPABASE_SHADOW_PORT)"

[db.pooler]
port = "env(BREPIA_SUPABASE_POOLER_PORT)"

[realtime]
# CLI 2.114.0 maps this setting to Realtime's Erlang network family. The
# repo-owned Podman shim separately pins the Brepia Realtime DB connection to
# the running database container's numeric IPv4 and injects DB_IP_VERSION=ipv4.
ip_version = "IPv4"

[edge_runtime]
# Brepia currently has no local Edge Functions. Keep the service disabled so
# the local stack only owns services the product actually uses.
enabled = false
inspector_port = "env(BREPIA_SUPABASE_EDGE_INSPECTOR_PORT)"

[studio]
port = "env(BREPIA_SUPABASE_STUDIO_PORT)"

[local_smtp]
port = "env(BREPIA_SUPABASE_LOCAL_SMTP_PORT)"
smtp_port = "env(BREPIA_SUPABASE_SMTP_PORT)"
pop3_port = "env(BREPIA_SUPABASE_POP3_PORT)"

[analytics]
# Brepia does not depend on the local Logs Explorer/Logflare service. Keep it
# disabled so the rootless local stack only starts product-required services.
enabled = false
port = "env(BREPIA_SUPABASE_ANALYTICS_PORT)"

[auth.email]
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_SECRET)"

[storage.buckets.meshes]
public = false

[storage.buckets.images]
public = false

[storage.buckets.previews]
public = false

[db.migrations]
schema_paths = [
  "./schemas/types.sql",
  "./schemas/conversations.sql",
  "./schemas/prompts.sql",
  "./schemas/ai_providers.sql",
  "./schemas/user_ai_preferences.sql",
  "./schemas/*.sql",
]
